<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --green-dark: #0F3D25;
    --green-mid: #155230;
    --green-pitch: #1E7A44;
    --green-light: #33AA5E;
    --white: #F5F0E8;
    --offwhite: #E8DFC8;
    --text-muted: #9A9080;
    --card-bg: rgba(20, 70, 42, 0.85);
    --card-border: rgba(201, 168, 76, 0.4);
    --group-tag: rgba(201, 168, 76, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--green-dark);
    font-family: 'Barlow', sans-serif;
    color: var(--white);
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(44,150,82,0.25) 0%, transparent 70%),
      repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,0.02) 60px, rgba(255,255,255,0.02) 61px),
      repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(255,255,255,0.02) 60px, rgba(255,255,255,0.02) 61px),
      var(--green-dark);
    min-height: 100vh;
    padding: 40px 60px 100px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
  }

  .header-left { display: flex; align-items: center; gap: 20px; }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 3px;
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
  }

  .header-sub {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .header-date { text-align: right; }

  .date-day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .date-full {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .proxy-status {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-top: 6px;
    text-align: right;
  }

  /* ── NO RESULTS ── */
  .no-results {
    text-align: center;
    padding: 100px 40px;
  }

  .no-results-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  .no-results-sub {
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .countdown-box {
    display: inline-block;
    margin-top: 32px;
    padding: 20px 40px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card-bg);
  }

  .countdown-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .countdown-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 4px;
  }

  /* ── RESULTS COUNT ── */
  .results-count {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .results-count span { color: var(--gold); font-weight: 600; }

  /* ── RESULTS GRID ── */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 20px;
  }

  /* ── RESULT CARD ── */
  .result-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(4px);
  }

  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .group-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--group-tag);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
  }

  .kickoff-time {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── TEAMS & SCORE ── */
  .teams-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .flag {
    width: 64px;
    height: 46px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    background: rgba(0,0,0,0.2);
  }

  .flag img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
  }

  .team-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--white);
    text-align: center;
  }

  .team-name.winner { color: var(--gold-light); }

  /* ── SCORE BLOCK ── */
  .score-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
    min-width: 90px;
  }

  .score-nums {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 2px;
    min-width: 28px;
    text-align: center;
  }

  .score-num.winner { color: var(--gold-light); }

  .score-sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: rgba(255,255,255,0.25);
  }

  .score-ft {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* ── VENUE ── */
  .venue-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .venue-icon { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
  .venue-text { font-size: 12px; color: var(--text-muted); letter-spacing: 0.5px; }

  /* ── SECTION HEADER ── */

  /* ── TICKER ── */
  .ticker-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    background: rgba(15, 58, 35, 0.97);
    border-top: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .ticker-label {
    padding: 0 20px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    white-space: nowrap;
    border-right: 1px solid var(--card-border);
    height: 100%;
    display: flex;
    align-items: center;
    background: rgba(15, 50, 30, 1);
    flex-shrink: 0;
    z-index: 9;
  }

  .ticker-scroll {
    display: flex;
    animation: ticker 50s linear infinite;
    white-space: nowrap;
    font-size: 13px;
    color: var(--offwhite);
    letter-spacing: 0.5px;
  }

  .ticker-item { padding: 0 48px 0 0; }
  .ticker-item strong { color: var(--gold); }

  @keyframes ticker {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
</style>
</head>

function getKickoffUTC(f){
  const [y,mo,d] = f.date.split('-').map(Number);
  return new Date(Date.UTC(y, mo-1, d, f.utcH, f.utcM));
}

function getDaysUntilWorldCup(){
  const now = new Date();
  const wc  = new Date('2026-06-11T00:00:00Z');
  return Math.max(0, Math.ceil((wc - now) / (1000*60*60*24)));
}

// ─── API config ───────────────────────────────────────────────
const RAPIDAPI_KEY  = 'aba7e0412bmsh77f82fad3bbf001p1f189fjsn4e02a526992d';
const RAPIDAPI_HOST = 'flashlive-sports.p.rapidapi.com';
const API_BASE      = 'https://flashlive-sports.p.rapidapi.com';
const SPORT_ID      = 1;
const LOCALE        = 'en_GB';
const FETCH_HOUR    = 7;

// ─── State ────────────────────────────────────────────────────
let cachedResults   = [];  // finished fixtures from last 24hrs
let lastFetchDate   = null;
let WC_STAGE_ID     = null;
let WC_SEASON_ID    = null;

// ─── Request counter ──────────────────────────────────────────
function getTodayKey(){ return 'wc_res_req_' + new Date().toISOString().slice(0,10); }
function getReqCount(){
  try { return parseInt(sessionStorage.getItem(getTodayKey()) || '0'); } catch(e){ return 0; }
}
function incReqCount(){
  try {
    const k = getTodayKey(), n = getReqCount() + 1;
    sessionStorage.setItem(k, n);
    Object.keys(sessionStorage).forEach(key => {
      if(key.startsWith('wc_res_req_') && key !== k) sessionStorage.removeItem(key);
    });
    updateStatusBar();
  } catch(e){}
}
const FREE_TIER_LIMIT = 100;

// ─── API fetch ────────────────────────────────────────────────
async function apiFetch(path){
  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE') throw new Error('NO_KEY');
  if(getReqCount() >= FREE_TIER_LIMIT) throw new Error('RATE_LIMIT');
  const res = await fetch(API_BASE + path, {
    headers: { 'x-rapidapi-key': RAPIDAPI_KEY, 'x-rapidapi-host': RAPIDAPI_HOST }
  });
  if(res.status === 429) throw new Error('RATE_LIMIT');
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  incReqCount();
  return res.json();
}

// ─── Resolve World Cup IDs ─────────────────────────────────────
async function resolveWCIds(){
  if(WC_STAGE_ID) return true;
  try {
    const data = await apiFetch(`/v1/tournaments/list?locale=${LOCALE}&sport_id=${SPORT_ID}`);
    for(const t of (data?.DATA || [])){
      const name    = (t.LEAGUE_NAME || '').toLowerCase();
      const country = (t.COUNTRY_NAME || '').toLowerCase();
      // FlashLive files the World Cup under "World Championship" with country "World"
      const isWorldCupTournament = country === 'world' && (
        name.includes('world cup') || name.includes('fifa world cup') ||
        name.includes('world championship')
      );
      if(isWorldCupTournament){
        WC_STAGE_ID  = t.STAGES?.[0]?.STAGE_ID || null;
        WC_SEASON_ID = t.ACTUAL_TOURNAMENT_SEASON_ID || null;
        return true;
      }
    }
    return false;
  } catch(e){ console.warn('resolveWCIds:', e.message); return false; }
}

// Knockout round label from FlashLive ROUND field
function knockoutRoundLabel(roundStr){
  const r = (roundStr || '').toLowerCase();
  if(r.includes('final') && !r.includes('semi') && !r.includes('quarter') && !r.includes('3rd')) return 'Final';
  if(r.includes('3rd') || r.includes('third place')) return '3rd Place';
  if(r.includes('semi'))    return 'Semi-Final';
  if(r.includes('quarter')) return 'Quarter-Final';
  if(r.includes('16'))      return 'Round of 16';
  if(r.includes('32'))      return 'Round of 32';
  if(r.includes('playoff')) return 'Playoff';
  return 'Knockout';
}

// ─── Fetch yesterday's results ─────────────────────────────────
async function fetchResults(){
  try {
    const data = await apiFetch(`/v1/events/list?locale=${LOCALE}&sport_id=${SPORT_ID}&timezone=0&indent_days=-1`);
    const results = [];

    // Log all group/tournament names so we can see what FlashLive calls the World Cup
    const allNames = (data?.DATA || []).map(g => g.NAME || g.LEAGUE_NAME || '');
    console.log('[FlashLive] Tournament names in yesterday response:', allNames);

    (data?.DATA || []).forEach(group => {
      const name    = (group.NAME || group.LEAGUE_NAME || '').toLowerCase();
      const country = (group.COUNTRY_NAME || '').toLowerCase();
      // FlashLive files the 2026 World Cup under "World: World Championship"
      const isWC = country === 'world' && (
        name.includes('world cup') || name.includes('world championship')
      );
      if(!isWC) return;

      (group.EVENTS || []).forEach(ev => {
        // Accept FINISHED or any non-live stage (some APIs use different keys)
        const stage = (ev.STAGE_TYPE || ev.STATUS || '').toUpperCase();
        // Log every event so we can see stage types in the console
        console.log('[FlashLive] Event:', ev.HOME_NAME, 'vs', ev.AWAY_NAME, '| STAGE_TYPE:', ev.STAGE_TYPE, '| FINISHED:', ev.FINISHED, '| Score:', ev.HOME_SCORE_CURRENT, '-', ev.AWAY_SCORE_CURRENT);
        const finished = stage === 'FINISHED' || stage === 'FT'    || stage === 'ENDED'
                      || stage === 'COMPLETE'  || stage === 'FINAL' || stage === 'AET'
                      || stage === 'PEN'       || stage === 'AFTER EXTRA TIME'
                      || ev.FINISHED === 1     || ev.FINISHED === true
                      // FlashLive sometimes uses numeric stage codes; anything > 90 is typically finished
                      || (typeof ev.STAGE_TYPE === 'number' && ev.STAGE_TYPE > 90);
        if(!finished) return;
        const home = normName(ev.HOME_NAME || '');
        const away = normName(ev.AWAY_NAME || '');
        const fixture = ALL_FIXTURES.find(f => f.home === home && f.away === away)
                     || ALL_FIXTURES.find(f => f.home === away && f.away === home);
        const roundLabel  = knockoutRoundLabel(ev.ROUND || '');
        const isKnockout   = !fixture || /round of|quarter|semi|final|3rd|third|knockout/i.test(ev.ROUND || '');
        results.push({
          home,
          away,
          homeCode:   FLAG_CODES[home] || 'un',
          awayCode:   FLAG_CODES[away] || 'un',
          homeScore:  parseInt(ev.HOME_SCORE_CURRENT) ?? null,
          awayScore:  parseInt(ev.AWAY_SCORE_CURRENT) ?? null,
          group:      isKnockout ? roundLabel : (fixture?.group || '?'),
          isKnockout,
          venue:      fixture?.venue || '',
          kickoff:    new Date((ev.START_TIME || 0) * 1000),
        });
      });
    });

    results.sort((a, b) => a.kickoff - b.kickoff);
    console.log('[FlashLive] Results found:', results.length);
    return results;
  } catch(e){ console.warn('fetchResults error:', e.message); return []; }
}


// ─── Main daily fetch ──────────────────────────────────────────
async function doFetch(){
  const today = new Date().toISOString().slice(0,10);
  setStatus('fetching');
  const wcOk = await resolveWCIds();
  if(!wcOk){ setStatus('no_tournament'); lastFetchDate = today; return; }

  cachedResults = await fetchResults();


  lastFetchDate = today;
  setStatus('ok');
}

// ─── Status bar ────────────────────────────────────────────────
let currentStatus = 'idle';
function setStatus(s){ currentStatus = s; updateStatusBar(); }

function updateStatusBar(){
  const el = document.getElementById('proxyStatus');
  if(!el) return;
  const count  = getReqCount();
  const pct    = Math.min(Math.round((count / FREE_TIER_LIMIT) * 100), 100);
  const barCol = pct >= 100 ? '#8B3030' : pct >= 80 ? '#C9A84C' : '#2C9652';
  const bar    = `<span style="display:inline-block;width:80px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-left:10px;vertical-align:middle;overflow:hidden;"><span style="display:block;width:${pct}%;height:100%;background:${barCol};border-radius:2px;"></span></span>`;

  const nextFetch = getNextFetchTime();
  const nextStr   = nextFetch ? ' · Next fetch ' + nextFetch : '';

  const msgs = {
    ok:            dot('#2C9652') + `Results fetched at ${FETCH_HOUR}:00 · ${count}/${FREE_TIER_LIMIT} requests` + nextStr + bar,
    fetching:      dot('#C9A84C') + 'Fetching results…',
    no_tournament: dot('#C9A84C') + 'World Cup not listed yet' + nextStr,
    limit:         dot('#8B3030') + `Daily limit reached (${count}/${FREE_TIER_LIMIT}) — resets at midnight`,
    no_key:        dot('#8B3030') + 'API key needed — see README',
    idle:          dot('#6A6050') + `Waiting for ${FETCH_HOUR}:00 fetch…` + nextStr,
    error:         dot('#8B3030') + 'Fetch failed — check console',
  };
  el.innerHTML = msgs[currentStatus] || msgs.idle;
}

function dot(col){
  return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:6px;vertical-align:middle;"></span>`;
}
function updateReqDisplay(){ updateStatusBar(); }

function getNextFetchTime(){
  const now  = new Date();
  const next = new Date(now);
  next.setHours(FETCH_HOUR, 0, 0, 0);
  if(next <= now) next.setDate(next.getDate() + 1);
  const diff = next - now;
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return h > 0 ? `in ${h}h ${m}m` : `in ${m}m`;
}

// ─── Render ────────────────────────────────────────────────────
function render(){
  const now    = new Date();
  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dayDisplay').textContent  = days[now.getDay()];
  document.getElementById('dateDisplay').textContent = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  const mainEl = document.getElementById('mainContent');

  // Before tournament starts
  if(now < new Date('2026-06-12T00:00:00Z')){
    const daysLeft = getDaysUntilWorldCup();
    mainEl.innerHTML = `
      <div class="no-results">
        <div class="no-results-title">No results yet!</div>
        <div class="no-results-sub">The tournament kicks off on 11 June 2026.<br>Check back the morning after the first game.</div>
        <div class="countdown-box">
          <div class="countdown-label">Days until kick-off</div>
          <div class="countdown-value">${daysLeft}</div>
        </div>
      </div>`;
    buildTicker([]);
    return;
  }

  if(cachedResults.length === 0){
    mainEl.innerHTML = `
      <div class="no-results">
        <div class="no-results-title">No results to show</div>
        <div class="no-results-sub">${currentStatus === 'idle'
          ? `Results will be fetched at ${FETCH_HOUR}:00 each morning.`
          : 'No finished matches found in the last 24 hours.'}</div>
      </div>`;
    buildTicker([]);
    return;
  }


  let html = `<div class="results-count"><span>${cachedResults.length}</span> result${cachedResults.length !== 1 ? 's' : ''} from the last 24 hours</div>`;
  html += `<div class="results-grid">`;

  cachedResults.forEach(r => {
    const hs = r.homeScore ?? null;
    const as = r.awayScore ?? null;
    const homeWin = hs !== null && as !== null && hs > as;
    const awayWin = hs !== null && as !== null && as > hs;
    const timeStr = r.kickoff.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZoneName:'short'});

    html += `
      <div class="result-card">
        <div class="card-top">
          <span class="group-badge">${r.isKnockout ? r.group : "Group " + r.group}</span>
          <span class="kickoff-time">🕐 ${timeStr}</span>
        </div>
        <div class="teams-row">
          <div class="team">
            <div class="flag">${flagImg(r.homeCode, 'lg')}</div>
            <div class="team-name ${homeWin ? 'winner' : ''}">${r.home}</div>
          </div>
          <div class="score-block">
            <div class="score-nums">
              <span class="score-num ${homeWin ? 'winner' : ''}">${hs !== null ? hs : '–'}</span>
              <span class="score-sep">–</span>
              <span class="score-num ${awayWin ? 'winner' : ''}">${as !== null ? as : '–'}</span>
            </div>
            <div class="score-ft">Full Time</div>
          </div>
          <div class="team">
            <div class="flag">${flagImg(r.awayCode, 'lg')}</div>
            <div class="team-name ${awayWin ? 'winner' : ''}">${r.away}</div>
          </div>
        </div>
        <div class="venue-row">
          <svg class="venue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span class="venue-text">${r.venue}</span>
        </div>
      </div>`;
  });

  html += `</div>`;


  mainEl.innerHTML = html;
  buildTicker(cachedResults);
}

function buildTicker(results){
  const items = results.length > 0
    ? results.map(r => {
        const score = (r.homeScore !== null && r.awayScore !== null)
          ? `<strong>${r.homeScore}–${r.awayScore}</strong>`
          : 'vs';
        return `<span class="ticker-item"><strong>${r.isKnockout ? r.group : "Group " + r.group}:</strong> ${r.home} ${score} ${r.away} · FT · ${r.venue}</span>`;
      })
    : [`<span class="ticker-item">World Cup 2026 · USA · Canada · Mexico · June 11 – July 19, 2026 · 48 Teams · 104 Matches</span>`];
  document.getElementById('tickerContent').innerHTML = [...items, ...items].join('');
}

// ─── Boot ──────────────────────────────────────────────────────
let clockInterval;

async function boot(){
  const now   = new Date();
  const today = now.toISOString().slice(0,10);
  const h     = now.getHours();

  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE'){
    setStatus('no_key'); render(); return;
  }

  if(getReqCount() >= FREE_TIER_LIMIT){
    setStatus('limit'); render(); return;
  }

  // Fetch if it's past 7am and we haven't fetched today
  if(h >= FETCH_HOUR && lastFetchDate !== today){
    await doFetch();
  } else {
    setStatus('idle');
  }

  render();

  // Check every minute if it's time to fetch
  clockInterval = setInterval(async () => {
    const now   = new Date();
    const today = now.toISOString().slice(0,10);
    const h     = now.getHours();
    if(h >= FETCH_HOUR && lastFetchDate !== today && getReqCount() < FREE_TIER_LIMIT){
      await doFetch();
      render();
    }
  }, 60*1000);
}

boot();

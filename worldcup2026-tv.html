<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Today's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --green-dark: #0A2A1A;
    --green-mid: #0D3B22;
    --green-pitch: #1A6B3C;
    --green-light: #2C9652;
    --white: #F5F0E8;
    --offwhite: #E8DFC8;
    --text-muted: #9A9080;
    --card-bg: rgba(15, 50, 30, 0.85);
    --card-border: rgba(201, 168, 76, 0.3);
    --group-tag: rgba(201, 168, 76, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--green-dark);
    font-family: 'Barlow', sans-serif;
    color: var(--white);
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(44,150,82,0.15) 0%, transparent 70%),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.012) 60px,
        rgba(255,255,255,0.012) 61px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.012) 60px,
        rgba(255,255,255,0.012) 61px
      ),
      var(--green-dark);
    min-height: 100vh;
    padding: 40px 60px 60px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .trophy-icon {
    width: 56px;
    height: 56px;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 3px;
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
  }

  .header-sub {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .header-date {
    text-align: right;
  }

  .date-day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .date-full {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── NO GAMES ── */
  .no-games {
    text-align: center;
    padding: 100px 40px;
  }

  .no-games-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  .no-games-sub {
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .countdown-box {
    display: inline-block;
    margin-top: 32px;
    padding: 20px 40px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card-bg);
  }

  .countdown-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .countdown-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 4px;
  }

  /* ── GAMES GRID ── */
  .games-count {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .games-count span {
    color: var(--gold);
    font-weight: 600;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 20px;
  }

  /* ── MATCH CARD ── */
  .match-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(4px);
    transition: border-color 0.2s;
  }

  .match-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .match-card.live {
    border-color: rgba(44,150,82,0.7);
    box-shadow: 0 0 24px rgba(44,150,82,0.15);
  }

  .match-card.live::before {
    background: linear-gradient(90deg, transparent, #2C9652, transparent);
    opacity: 1;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .group-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--group-tag);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
  }

  .live-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(44,150,82,0.7);
    border: 1px solid rgba(44,150,82,0.9);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .kickoff-time {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── TEAMS ── */
  .teams-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .flag {
    width: 64px;
    height: 46px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    background: rgba(0,0,0,0.2);
  }
  .flag img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
  }

  .team-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--white);
    text-align: center;
  }

  .vs-divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .vs-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
  }

  /* ── VENUE ── */
  .venue-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .venue-icon {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .venue-text {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* ── GROUP BREAKDOWN SECTION ── */
  .section-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--gold);
    margin: 52px 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .group-card {
    background: rgba(15, 50, 30, 0.6);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 12px;
    padding: 20px 22px;
  }

  .group-card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .standings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .standings-table thead tr {
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .standings-table th {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    padding: 0 0 7px;
    text-align: right;
  }

  .standings-table th.col-team {
    text-align: left;
  }

  .standings-table td {
    padding: 6px 0;
    text-align: right;
    color: var(--offwhite);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .standings-table td.col-team {
    text-align: left;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .standings-table tr:last-child td {
    border-bottom: none;
  }

  .standings-table tr.playing-row td {
    color: var(--white);
    font-weight: 700;
  }

  .standings-table td.pts-col {
    color: var(--gold);
    font-weight: 700;
    font-size: 14px;
  }

  .standings-table tr.playing-row td.pts-col {
    color: var(--gold-light);
  }

  .team-flag-sm {
    width: 22px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 2px;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
  }
  .team-flag-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .playing-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    display: inline-block;
    margin-left: 2px;
  }

  .pos-num {
    font-size: 11px;
    color: var(--text-muted);
    width: 14px;
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 60px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── TICKER ── */
  .live-score, .final-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .live-score {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 1px;
  }

  .score-sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: rgba(255,255,255,0.3);
  }

  .score-min {
    font-size: 11px;
    color: var(--green-light);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .final-score {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .score-ft {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .proxy-status {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── DEMO MODE ── */
  .demo-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    background: rgba(201,168,76,0.97);
    color: #0A2A1A;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .demo-bar-left { display:flex; align-items:center; gap:10px; }
  .demo-label { font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:0.7; }
  .demo-date { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; }
  .demo-time-controls { display:flex; align-items:center; gap:6px; }
  .demo-time-btn {
    background: rgba(10,42,26,0.2);
    border: 1px solid rgba(10,42,26,0.3);
    border-radius: 6px;
    color: #0A2A1A;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .demo-time-btn:hover { background: rgba(10,42,26,0.35); }
  .demo-time-btn.active { background: rgba(10,42,26,0.5); color:#E8C96A; }
  .demo-exit {
    background: rgba(10,42,26,0.25);
    border: 1px solid rgba(10,42,26,0.35);
    border-radius: 6px;
    color: #0A2A1A;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .demo-exit:hover { background: rgba(10,42,26,0.4); }
  body.demo-active { padding-top: 80px; }

  .ticker-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    background: rgba(10, 42, 26, 0.97);
    border-top: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .ticker-label {
    padding: 0 20px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    white-space: nowrap;
    border-right: 1px solid var(--card-border);
    height: 100%;
    display: flex;
    align-items: center;
    background: #0D3B22;
    flex-shrink: 0;
    z-index: 9;
  }

  .ticker-scroll {
    display: flex;
    gap: 0;
    animation: ticker 60s linear infinite;
    white-space: nowrap;
    font-size: 13px;
    color: var(--offwhite);
    letter-spacing: 0.5px;
  }

  .ticker-item {
    padding: 0 48px 0 0;
  }

  .ticker-item strong {
    color: var(--gold);
  }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>

<button id="demoToggleBtn" onclick="toggleDemo()" style="

<div id="demoBar" style="display:none;" class="demo-bar">

      <button class="demo-time-btn" onclick="setDemoTime('pre')"    id="dt-pre">Pre-Match</button>
      <button class="demo-time-btn" onclick="setDemoTime('live1')"  id="dt-live1">1st Half</button>
      <button class="demo-time-btn" onclick="setDemoTime('ht')"     id="dt-ht">Half Time</button>
      <button class="demo-time-btn" onclick="setDemoTime('live2')"  id="dt-live2">2nd Half</button>
      <button class="demo-time-btn" onclick="setDemoTime('ft')"     id="dt-ft">Full Time</button>
    </div>
  </div>
  <button class="demo-exit" onclick="exitDemo()">✕ Exit Demo</button>
</div>

<div id="mainContent"></div>

<div class="ticker-bar">
  <div class="ticker-label">⚽ WC 2026</div>
  <div class="ticker-scroll" id="tickerContent"></div>
</div>

// ─── Fetch helper ─────────────────────────────────────────────
async function apiFetch(path){
  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE') throw new Error('No API key');
  const res = await fetch(API_BASE + path, {
    headers: {

      'x-rapidapi-host': RAPIDAPI_HOST,
    }
  });
  if(!res.ok) throw new Error(`HTTP ${res.status}`);

// ─── Find World Cup stage/season IDs ──────────────────────────
async function resolveWCIds(){
  if(WC_STAGE_ID) return true;
  try {
    const data = await apiFetch(`/v1/tournaments/list?locale=${LOCALE}&sport_id=${SPORT_ID}`);
    const tournaments = data?.DATA || [];
    for(const t of tournaments){
      const name = (t.LEAGUE_NAME || '').toLowerCase();
      const country = (t.COUNTRY_NAME || '').toLowerCase();
      if((name.includes('world cup') || name.includes('fifa world cup')) && country === 'world'){
        WC_STAGE_ID  = t.STAGES?.[0]?.STAGE_ID || null;
        WC_SEASON_ID = t.ACTUAL_TOURNAMENT_SEASON_ID || null;
        console.log('WC IDs resolved:', WC_STAGE_ID, WC_SEASON_ID);
        return true;
      }
    }
    console.warn('World Cup not found in tournament list');
    return false;
  } catch(e){
    console.warn('resolveWCIds failed:', e.message);
    return false;
  }
}

// ─── Fetch live scores ─────────────────────────────────────────
async function fetchLiveScores(){
  try {
    const data = await apiFetch(`/v1/events/live-list?locale=${LOCALE}&sport_id=${SPORT_ID}&timezone=0`);
    const groups = data?.DATA || [];
    const now = Date.now();
    groups.forEach(group => {
      const groupName = group.NAME || '';
      if(!groupName.toLowerCase().includes('world cup')) return;
      (group.EVENTS || []).forEach(ev => {
        const key = buildScoreKey(ev.HOME_NAME, ev.START_TIME);
        if(!key) return;
        const stage = ev.STAGE || '';
        const isLive = ev.STAGE_TYPE === 'LIVE';
        const isFt   = ev.STAGE_TYPE === 'FINISHED';
        if(isLive || isFt){
          scoreCache[key] = {
            home:    parseInt(ev.HOME_SCORE_CURRENT) ?? null,
            away:    parseInt(ev.AWAY_SCORE_CURRENT) ?? null,
            minute:  isLive ? calcMinute(ev) : null,
            status:  isLive ? 'live' : 'ft',
            fetchedAt: now,
          };
        }
      });
    });
  } catch(e){
    console.warn('fetchLiveScores failed:', e.message);
    setProxyStatus('warn');
  }
}

async function fetchTodayResults(){
  try {
    const data = await apiFetch(`/v1/events/list?locale=${LOCALE}&sport_id=${SPORT_ID}&timezone=0&indent_days=0`);
    const groups = data?.DATA || [];
    const now = Date.now();
    groups.forEach(group => {
      if(!(group.NAME||'').toLowerCase().includes('world cup')) return;
      (group.EVENTS || []).forEach(ev => {
        if(ev.STAGE_TYPE !== 'FINISHED') return;
        const key = buildScoreKey(ev.HOME_NAME, ev.START_TIME);
        if(!key || scoreCache[key]) return;
        scoreCache[key] = {
          home:   parseInt(ev.HOME_SCORE_CURRENT) ?? null,
          away:   parseInt(ev.AWAY_SCORE_CURRENT) ?? null,
          minute: null,
          status: 'ft',
          fetchedAt: now,
        };
      });
    });
  } catch(e){ /* silent */ }
}

// Build a cache key from the API team name + unix timestamp
// We match to our fixture list by normalising the team name
function buildScoreKey(apiHomeName, unixTime){
  const norm = normName(apiHomeName);
  // Find the fixture date from the unix timestamp
  const d = new Date(unixTime * 1000);
  const date = d.toISOString().slice(0,10);
  return `${date}_${norm}`;
}

function calcMinute(ev){
  // FlashLive doesn't return elapsed minutes directly —
  // calculate from period start time if available, else null
  const now = Math.floor(Date.now()/1000);
  const start = ev.START_TIME;
  if(!start) return null;
  const elapsed = Math.floor((now - start) / 60);
  return Math.min(elapsed, 90);
}

// ─── Fetch standings from FlashLive ───────────────────────────
async function fetchStandings(groupLetter){
  // Demo FT mode uses pre-set demo standings
  if(DEMO_MODE && DEMO_TIME === 'ft' && DEMO_STANDINGS[groupLetter]){
    return DEMO_STANDINGS[groupLetter];
  }

  const cached = standingsCache[groupLetter];
  const now    = Date.now();
  const anyLive = Object.values(scoreCache).some(s => s.status === 'live');
  const ttl    = anyLive ? 2*60*1000 : 10*60*1000;
  if(cached && (now - cached.fetchedAt) < ttl) return cached.rows;

  if(!WC_STAGE_ID || !WC_SEASON_ID){
    await resolveWCIds();
    if(!WC_STAGE_ID) return fallbackStandings(groupLetter);
  }

  try {
    const data = await apiFetch(
      `/v1/tournaments/standings?locale=${LOCALE}&standing_type=home_away_total&tournament_stage_id=${WC_STAGE_ID}&tournament_season_id=${WC_SEASON_ID}`
    );
    const tables = data?.DATA || [];

    // FlashLive returns an array of group tables for a World Cup
    // Each table has a NAME like "Group A" and ROWS array
    tables.forEach(table => {
      const rawName = table.NAME || table.LEAGUE_NAME || '';
      const match   = rawName.match(/Group\s+([A-L])/i);
      if(!match) return;
      const letter = match[1].toUpperCase();

      const rows = (table.ROWS || table.STANDINGS || []).map((row, i) => ({
        pos:  row.RANK || i + 1,
        name: normName(row.TEAM_NAME || row.NAME || ''),
        code: FLAG_CODES[normName(row.TEAM_NAME || row.NAME || '')] || 'un',
        p:    row.PLAYED       ?? row.GP ?? 0,
        w:    row.WINS         ?? row.W  ?? 0,
        d:    row.DRAWS        ?? row.D  ?? 0,
        l:    row.LOSSES       ?? row.L  ?? 0,
        gf:   row.GOALS_FOR    ?? row.GF ?? 0,
        ga:   row.GOALS_AGAINST?? row.GA ?? 0,
        pts:  row.POINTS       ?? row.PTS?? 0,
      }));

      standingsCache[letter] = { rows, fetchedAt: now };
    });

    return standingsCache[groupLetter]?.rows || fallbackStandings(groupLetter);
  } catch(e){
    console.warn('fetchStandings failed:', e.message);
    setProxyStatus('warn');
    return standingsCache[groupLetter]?.rows || fallbackStandings(groupLetter);
  }
}

function fallbackStandings(groupLetter){
  const teams = GROUP_TEAMS[groupLetter] || [];
  return teams.map((t, i) => ({
    pos: i+1, name: t.name, code: t.code,
    p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0
  }));
}

// ─── Proxy / API status ────────────────────────────────────────
function setProxyStatus(state){
  const el = document.getElementById('proxyStatus');
  if(!el) return;
  if(DEMO_MODE){
    el.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#C9A84C;margin-right:6px;vertical-align:middle;"></span>Demo mode active';
    return;
  }
  const states = {
    ok:   { dot:'#2C9652', text:'Live data connected' },
    warn: { dot:'#C9A84C', text:'Using cached data' },
    off:  { dot:'#8B3030', text:'API key needed — see README' },
  };
  const s = states[state] || states.off;
  el.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.dot};margin-right:6px;vertical-align:middle;"></span>${s.text}`;
}

async function checkProxy(){
  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE'){
    setProxyStatus('off');
    return false;
  }
  try {
    // Lightweight check — just hit sports list
    await apiFetch(`/v1/sports/list`);
    setProxyStatus('ok');
    return true;
  } catch(e){
    setProxyStatus('off');
    return false;
  }
}

// ─── Render ────────────────────────────────────────────────────
function render(){
  const now   = getNow();
  const in24h = new Date(now.getTime() + 24*60*60*1000);

  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dayDisplay').textContent  = days[now.getDay()];
  document.getElementById('dateDisplay').textContent = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  const todayFixtures = ALL_FIXTURES.filter(f => {
    const ko = getKickoffUTC(f);
    return ko >= now && ko <= in24h;
  });

  const liveFixtures = ALL_FIXTURES.filter(f => {
    const ko = getKickoffUTC(f);
    const elapsed = now - ko;
    return elapsed >= 0 && elapsed <= 115*60*1000;
  });
  const liveSet = new Set(liveFixtures.map(f => f.date+'_'+f.group+'_'+f.home));

  const involvedGroups = [...new Set([...todayFixtures,...liveFixtures].map(f=>f.group))].sort();
  const mainEl = document.getElementById('mainContent');

  if(todayFixtures.length === 0 && liveFixtures.length === 0){
    const wcStart = new Date('2026-06-11T19:00:00Z');
    if(now < wcStart){
      const daysLeft = getDaysUntilWorldCup();
      mainEl.innerHTML = `
        <div class="no-games">
          <div class="no-games-title">The World Cup hasn't started yet!</div>
          <div class="no-games-sub">The tournament kicks off on 11 June 2026<br>with Mexico vs South Africa at the Estadio Azteca.</div>
          <div class="countdown-box">
            <div class="countdown-label">Days until kick-off</div>
            <div class="countdown-value">${daysLeft}</div>
          </div>
        </div>`;
    } else {
      mainEl.innerHTML = `
        <div class="no-games">
          <div class="no-games-title">No matches in the next 24 hours</div>
          <div class="no-games-sub">Check back later — more group stage action is on the way.</div>
        </div>`;
    }
    buildTicker([]);
    return;
  }

  const allShow = [
    ...liveFixtures.filter(f => !todayFixtures.find(t => t.date===f.date && t.home===f.home)),
    ...todayFixtures
  ];

  let html = `<div class="games-count"><span>${allShow.length}</span> match${allShow.length!==1?'es':''} in the next 24 hours</div>`;
  html += `<div class="games-grid">`;

  allShow.forEach(f => {
    const ko       = getKickoffUTC(f);
    const localStr = formatLocalTime(ko);
    const id       = f.date+'_'+f.group+'_'+f.home;
    const isLive   = liveSet.has(id);
    const score    = getApiScore(f);
    const hasScore = score && score.home !== null && score.away !== null;

    let scoreHtml = '';
    if(isLive && hasScore){
      scoreHtml = `<div class="live-score">
        <span class="score-num">${score.home}</span>
        <span class="score-sep">–</span>
        <span class="score-num">${score.away}</span>
        ${score.minute ? `<span class="score-min">${score.minute}'</span>` : ''}
      </div>`;
    } else if(!isLive && hasScore){
      scoreHtml = `<div class="final-score">
        <span class="score-num">${score.home}</span>
        <span class="score-sep">–</span>
        <span class="score-num">${score.away}</span>
        <span class="score-ft">FT</span>
      </div>`;
    }

    html += `
      <div class="match-card ${isLive ? 'live' : ''}">
        <div class="card-top">
          <span class="group-badge">Group ${f.group}</span>
          ${isLive
            ? `<span class="live-badge">⚽ Live</span>`
            : `<span class="kickoff-time">🕐 ${localStr}</span>`}
        </div>
        <div class="teams-row">
          <div class="team">
            <div class="flag">${flagImg(FLAG_CODES[f.home] || FLAG_CODES[normName(f.home)] || 'un', 'lg')}</div>
            <div class="team-name">${f.home}</div>
          </div>
          <div class="vs-divider">
            ${hasScore ? scoreHtml : '<span class="vs-text">VS</span>'}
          </div>
          <div class="team">
            <div class="flag">${flagImg(FLAG_CODES[f.away] || FLAG_CODES[normName(f.away)] || 'un', 'lg')}</div>
            <div class="team-name">${f.away}</div>
          </div>
        </div>
        <div class="venue-row">
          <svg class="venue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span class="venue-text">${f.venue}</span>
        </div>
      </div>`;
  });
  html += `</div>`;

  if(involvedGroups.length > 0){
    html += `<div class="section-header">Group Standings</div>`;
    html += `<div class="groups-grid" id="standingsGrid"></div>`;
  }

  mainEl.innerHTML = html;
  buildTicker(allShow);

  if(involvedGroups.length > 0){
    involvedGroups.forEach(g => renderGroupCard(g, allShow));
  }
}

async function renderGroupCard(g, allShow){
  const grid = document.getElementById('standingsGrid');
  if(!grid) return;
  const playingNow = new Set(allShow.filter(f=>f.group===g).flatMap(f=>[f.home,f.away]));
  const placeholder = document.createElement('div');
  placeholder.className = 'group-card';
  placeholder.id = `gc-${g}`;
  placeholder.innerHTML = `<div class="group-card-title">Group ${g}</div><div style="color:var(--text-muted);font-size:12px;padding:8px 0;">Loading standings…</div>`;
  grid.appendChild(placeholder);

  const standings = await fetchStandings(g);
  const card = document.getElementById(`gc-${g}`);
  if(!card) return;

  let tableHtml = `
    <div class="group-card-title">Group ${g}</div>
    <table class="standings-table">
      <thead><tr>
        <th class="col-team" colspan="2"></th>
        <th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th>
      </tr></thead><tbody>`;

  standings.forEach((t, i) => {
    const isPlaying = playingNow.has(t.name);
    tableHtml += `
      <tr class="${isPlaying ? 'playing-row' : ''}">
        <td class="col-team" style="display:table-cell;padding-right:6px;width:18px;"><span class="pos-num">${i+1}</span></td>
        <td class="col-team">
          <span class="team-flag-sm">${flagImg(t.code || FLAG_CODES[t.name] || 'un', 'sm')}</span>
          <span>${t.name}</span>
          ${isPlaying ? '<span class="playing-indicator"></span>' : ''}
        </td>
        <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
        <td class="pts-col">${t.pts}</td>
      </tr>`;
  });
  tableHtml += `</tbody></table>`;
  card.innerHTML = tableHtml;
}

function buildTicker(fixtures){
  const items = fixtures.length > 0
    ? fixtures.map(f => {
        const score    = getApiScore(f);
        const hasScore = score && score.home !== null && score.away !== null;
        const ko       = getKickoffUTC(f);
        const t        = formatLocalTime(ko);
        const scoreStr = hasScore ? ` · <strong>${score.home}–${score.away}</strong>` : ` · ${t}`;
        return `<span class="ticker-item"><strong>Group ${f.group}:</strong> ${f.home} vs ${f.away}${scoreStr} · ${f.venue}</span>`;
      })
    : [`<span class="ticker-item">World Cup 2026 · USA · Canada · Mexico · June 11 – July 19, 2026 · 48 Teams · 104 Matches</span>`];

  const doubled = [...items, ...items].join('');
  document.getElementById('tickerContent').innerHTML = doubled;
}

// ─── Boot & refresh loop ───────────────────────────────────────
let refreshInterval;

async function boot(){
  const apiOk = await checkProxy();
  if(apiOk){
    await resolveWCIds();
    await fetchLiveScores();
    await fetchTodayResults();
  }
  render();

  clearInterval(refreshInterval);
  refreshInterval = setInterval(async () => {
    const apiOk = await checkProxy();
    if(apiOk){
      await fetchLiveScores();
      await fetchTodayResults();
      // Bust standings cache for currently live groups
      const now = getNow();
      ALL_FIXTURES.forEach(f => {
        const ko = getKickoffUTC(f);
        const elapsed = now - ko;
        if(elapsed >= 0 && elapsed <= 115*60*1000){
          delete standingsCache[f.group];
        }
      });
    }
    render();
  }, 60*1000);
}

boot();

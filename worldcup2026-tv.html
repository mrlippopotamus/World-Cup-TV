<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — Today's Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --green-dark: #0A2A1A;
    --green-mid: #0D3B22;
    --green-pitch: #1A6B3C;
    --green-light: #2C9652;
    --white: #F5F0E8;
    --offwhite: #E8DFC8;
    --text-muted: #9A9080;
    --card-bg: rgba(15, 50, 30, 0.85);
    --card-border: rgba(201, 168, 76, 0.3);
    --group-tag: rgba(201, 168, 76, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--green-dark);
    font-family: 'Barlow', sans-serif;
    color: var(--white);
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(44,150,82,0.15) 0%, transparent 70%),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.012) 60px,
        rgba(255,255,255,0.012) 61px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.012) 60px,
        rgba(255,255,255,0.012) 61px
      ),
      var(--green-dark);
    min-height: 100vh;
    padding: 40px 60px 100px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .trophy-icon {
    width: 56px;
    height: 56px;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 3px;
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
  }

  .header-sub {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .header-date {
    text-align: right;
  }

  .date-day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .date-full {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── NO GAMES ── */
  .no-games {
    text-align: center;
    padding: 100px 40px;
  }

  .no-games-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  .no-games-sub {
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .countdown-box {
    display: inline-block;
    margin-top: 32px;
    padding: 20px 40px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card-bg);
  }

  .countdown-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .countdown-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 4px;
  }

  /* ── GAMES GRID ── */
  .games-count {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .games-count span {
    color: var(--gold);
    font-weight: 600;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 20px;
  }

  /* ── MATCH CARD ── */
  .match-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(4px);
    transition: border-color 0.2s;
  }

  .match-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .match-card.live {
    border-color: rgba(44,150,82,0.7);
    box-shadow: 0 0 24px rgba(44,150,82,0.15);
  }

  .match-card.live::before {
    background: linear-gradient(90deg, transparent, #2C9652, transparent);
    opacity: 1;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .group-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--group-tag);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
  }

  .live-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(44,150,82,0.7);
    border: 1px solid rgba(44,150,82,0.9);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .kickoff-time {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── TEAMS ── */
  .teams-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .flag {
    width: 64px;
    height: 46px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    background: rgba(0,0,0,0.2);
  }
  .flag img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
  }

  .team-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--white);
    text-align: center;
  }

  .vs-divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .vs-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
  }

  /* ── VENUE ── */
  .venue-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .venue-icon {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .venue-text {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* ── GROUP BREAKDOWN SECTION ── */
  .section-header {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--gold);
    margin: 52px 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .section-header::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }

  .group-card {
    background: rgba(15, 50, 30, 0.6);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 12px;
    padding: 20px 22px;
  }

  .group-card-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 12px;
  }

  .standings-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .standings-table thead tr {
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .standings-table th {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    padding: 0 0 7px;
    text-align: right;
  }

  .standings-table th.col-team {
    text-align: left;
  }

  .standings-table td {
    padding: 6px 0;
    text-align: right;
    color: var(--offwhite);
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .standings-table td.col-team {
    text-align: left;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .standings-table tr:last-child td {
    border-bottom: none;
  }

  .standings-table tr.playing-row td {
    color: var(--white);
    font-weight: 700;
  }

  .standings-table td.pts-col {
    color: var(--gold);
    font-weight: 700;
    font-size: 14px;
  }

  .standings-table tr.playing-row td.pts-col {
    color: var(--gold-light);
  }

  .team-flag-sm {
    width: 22px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 2px;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
  }
  .team-flag-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .playing-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    display: inline-block;
    margin-left: 2px;
  }

  .pos-num {
    font-size: 11px;
    color: var(--text-muted);
    width: 14px;
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 60px;
    margin-bottom: 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── TICKER ── */
  .live-score, .final-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .live-score {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 1px;
  }

  .score-sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: rgba(255,255,255,0.3);
  }

  .score-min {
    font-size: 11px;
    color: var(--green-light);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .final-score {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .score-ft {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .proxy-status {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── DEMO MODE ── */
  .demo-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 999;
    background: rgba(201,168,76,0.97);
    color: #0A2A1A;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .demo-bar-left { display:flex; align-items:center; gap:10px; }
  .demo-label { font-size:11px; letter-spacing:3px; text-transform:uppercase; opacity:0.7; }
  .demo-date { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; }
  .demo-time-controls { display:flex; align-items:center; gap:6px; }
  .demo-time-btn {
    background: rgba(10,42,26,0.2);
    border: 1px solid rgba(10,42,26,0.3);
    border-radius: 6px;
    color: #0A2A1A;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .demo-time-btn:hover { background: rgba(10,42,26,0.35); }
  .demo-time-btn.active { background: rgba(10,42,26,0.5); color:#E8C96A; }
  .demo-exit {
    background: rgba(10,42,26,0.25);
    border: 1px solid rgba(10,42,26,0.35);
    border-radius: 6px;
    color: #0A2A1A;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .demo-exit:hover { background: rgba(10,42,26,0.4); }
  body.demo-active { padding-top: 80px; }

  .ticker-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    background: rgba(10, 42, 26, 0.97);
    border-top: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .ticker-label {
    padding: 0 20px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    white-space: nowrap;
    border-right: 1px solid var(--card-border);
    height: 100%;
    display: flex;
    align-items: center;
    background: rgba(201,168,76,0.08);
    flex-shrink: 0;
  }

  .ticker-scroll {
    display: flex;
    gap: 0;
    animation: ticker 60s linear infinite;
    white-space: nowrap;
    font-size: 13px;
    color: var(--offwhite);
    letter-spacing: 0.5px;
  }

  .ticker-item {
    padding: 0 48px 0 0;
  }

  .ticker-item strong {
    color: var(--gold);
  }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>

<div id="demoBar" style="display:none;" class="demo-bar">

</div>

<div id="mainContent"></div>

<div class="ticker-bar">
  <div class="ticker-label">⚽ WC 2026</div>

</div>

// ─── API fetch ────────────────────────────────────────────────
async function apiFetch(path){
  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE') throw new Error('NO_KEY');
  if(getReqCount() >= FREE_TIER_LIMIT) throw new Error('RATE_LIMIT');
  const res = await fetch(API_BASE + path, {
    headers: {
      'x-rapidapi-key':  RAPIDAPI_KEY,
      'x-rapidapi-host': RAPIDAPI_HOST,
    }
  });
  if(res.status === 429) throw new Error('RATE_LIMIT');
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  incReqCount();
  return res.json();
}

// ─── Resolve World Cup tournament IDs ─────────────────────────
async function resolveWCIds(){
  if(WC_STAGE_ID) return true;
  try {
    const data = await apiFetch(`/v1/tournaments/list?locale=${LOCALE}&sport_id=${SPORT_ID}`);
    for(const t of (data?.DATA || [])){
      const name    = (t.LEAGUE_NAME || '').toLowerCase();
      const country = (t.COUNTRY_NAME || '').toLowerCase();
      if((name.includes('world cup') || name.includes('fifa world cup')) && country === 'world'){
        WC_STAGE_ID  = t.STAGES?.[0]?.STAGE_ID || null;
        WC_SEASON_ID = t.ACTUAL_TOURNAMENT_SEASON_ID || null;
        return true;
      }
    }
    return false;
  } catch(e){ console.warn('resolveWCIds:', e.message); return false; }
}

// ─── Fetch today's fixtures from FlashLive ────────────────────
async function fetchTodayFixtures(){
  try {
    const data = await apiFetch(`/v1/events/list?locale=${LOCALE}&sport_id=${SPORT_ID}&timezone=0&indent_days=0`);
    const result = [];
    (data?.DATA || []).forEach(group => {
      if(!(group.NAME||'').toLowerCase().includes('world cup')) return;
      (group.EVENTS || []).forEach(ev => {
        const home = normName(ev.HOME_NAME || '');
        const away = normName(ev.AWAY_NAME || '');
        // Find matching fixture in our schedule for venue/group info
        const match = ALL_FIXTURES.find(f => f.home === home || f.away === away || f.home === away || f.away === home);
        result.push({
          home, away,
          homeCode: FLAG_CODES[home] || 'un',
          awayCode: FLAG_CODES[away] || 'un',
          group:    match?.group  || '?',
          venue:    match?.venue  || '',
          kickoff:  new Date(ev.START_TIME * 1000),
          homeFT:   ev.STAGE_TYPE === 'FINISHED' ? parseInt(ev.HOME_SCORE_CURRENT) : null,
          awayFT:   ev.STAGE_TYPE === 'FINISHED' ? parseInt(ev.AWAY_SCORE_CURRENT) : null,
        });
      });
    });
    return result;
  } catch(e){ console.warn('fetchTodayFixtures:', e.message); return []; }
}

// ─── Fetch group standings ─────────────────────────────────────
async function fetchAllStandings(groups){
  if(!WC_STAGE_ID || !WC_SEASON_ID) return {};
  try {
    const data = await apiFetch(
      `/v1/tournaments/standings?locale=${LOCALE}&standing_type=home_away_total&tournament_stage_id=${WC_STAGE_ID}&tournament_season_id=${WC_SEASON_ID}`
    );
    const result = {};
    (data?.DATA || []).forEach(table => {
      const m = (table.NAME || table.LEAGUE_NAME || '').match(/Group\s+([A-L])/i);
      if(!m) return;
      const letter = m[1].toUpperCase();
      if(!groups.includes(letter)) return; // only fetch groups we need
      result[letter] = (table.ROWS || table.STANDINGS || []).map((row, i) => ({
        pos:  row.RANK  || i + 1,
        name: normName(row.TEAM_NAME || row.NAME || ''),
        code: FLAG_CODES[normName(row.TEAM_NAME || row.NAME || '')] || 'un',
        p:    row.PLAYED        ?? row.GP  ?? 0,
        w:    row.WINS          ?? row.W   ?? 0,
        d:    row.DRAWS         ?? row.D   ?? 0,
        l:    row.LOSSES        ?? row.L   ?? 0,
        gf:   row.GOALS_FOR     ?? row.GF  ?? 0,
        ga:   row.GOALS_AGAINST ?? row.GA  ?? 0,
        pts:  row.POINTS        ?? row.PTS ?? 0,
      }));
    });
    return result;
  } catch(e){ console.warn('fetchAllStandings:', e.message); return {}; }
}

// ─── Main daily fetch ─────────────────────────────────────────
async function doFetch(){
  const today = getNow().toISOString().slice(0,10);
  setStatus('fetching');

  const wcOk = await resolveWCIds();
  if(!wcOk){
    // Tournament not listed yet — fall back to our hardcoded fixture schedule
    cachedFixtures  = [];
    cachedStandings = {};
    lastFetchDate   = today;
    setStatus('no_tournament');
    return;
  }

  // Fetch fixtures + standings in parallel — only 2-3 requests total
  const [fixtures] = await Promise.all([ fetchTodayFixtures() ]);
  cachedFixtures = fixtures;

  // Get the groups playing today so we only fetch relevant standings
  const groups = [...new Set([
    ...fixtures.map(f => f.group),
    ...getTodayFromSchedule().map(f => f.group),
  ].filter(g => g !== '?'))].sort();

  if(groups.length > 0){
    cachedStandings = await fetchAllStandings(groups);
  }

  lastFetchDate = today;
  setStatus('ok');
}

let currentStatus = 'idle';

function updateStatusBar(){
  const el = document.getElementById('proxyStatus');
  if(!el) return;
  if(DEMO_MODE){
    el.innerHTML = dot('#C9A84C') + 'Demo mode active';
    return;
  }
  const count = getReqCount();
  const pct   = Math.min(Math.round((count / FREE_TIER_LIMIT) * 100), 100);
  const barCol = pct >= 100 ? '#8B3030' : pct >= 80 ? '#C9A84C' : '#2C9652';
  const bar    = `<span style="display:inline-block;width:80px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-left:10px;vertical-align:middle;overflow:hidden;"><span style="display:block;width:${pct}%;height:100%;background:${barCol};border-radius:2px;"></span></span>`;

  const nextFetch = getNextFetchTime();
  const nextStr   = nextFetch ? ' · Next fetch ' + nextFetch : '';

  const msgs = {
    ok:            dot('#2C9652') + `Data fetched at ${FETCH_HOUR}:00 · ${count}/${FREE_TIER_LIMIT} requests used today` + nextStr + bar,
    fetching:      dot('#C9A84C') + 'Fetching data…',
    no_tournament: dot('#C9A84C') + 'World Cup not listed yet — using schedule data' + nextStr,
    limit:         dot('#8B3030') + `Daily limit reached (${count}/${FREE_TIER_LIMIT}) — resets at midnight`,
    no_key:        dot('#8B3030') + 'API key needed — see README',
    idle:          dot('#6A6050') + 'Waiting for ' + FETCH_HOUR + ':00 fetch…',
    error:         dot('#8B3030') + 'Fetch failed — using schedule data' + nextStr,
  };
  el.innerHTML = msgs[currentStatus] || msgs.idle;
}
function dot(col){
  return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:6px;vertical-align:middle;"></span>`;
}
function updateReqDisplay(){ updateStatusBar(); }

function getNextFetchTime(){
  const now  = getNow();
  const next = new Date(now);
  next.setHours(FETCH_HOUR, 0, 0, 0);
  if(next <= now) next.setDate(next.getDate() + 1);
  const diff = next - now;
  const h    = Math.floor(diff / 3600000);
  const m    = Math.floor((diff % 3600000) / 60000);
  if(h > 0) return `in ${h}h ${m}m`;
  return `in ${m}m`;
}

// ─── Score lookup ──────────────────────────────────────────────
function getApiScore(fixture){
  if(DEMO_MODE) return getDemoScore(fixture);
  const match = cachedFixtures.find(f => f.home === fixture.home && f.away === fixture.away);
  if(!match) return null;
  if(match.homeFT !== null && match.awayFT !== null){
    return { home: match.homeFT, away: match.awayFT, minute: null, status: 'ft' };
  }
  return null;
}

// ─── Get today's fixtures from hardcoded schedule (fallback) ──
function getTodayFromSchedule(){
  const now   = getNow();
  const in24h = new Date(now.getTime() + 24*60*60*1000);
  return ALL_FIXTURES.filter(f => {
    const ko = getKickoffUTC(f);
    return ko >= now && ko <= in24h;
  });
}

// ─── Standings lookup ─────────────────────────────────────────
function getStandings(groupLetter){
  if(DEMO_MODE && DEMO_TIME === 'ft' && DEMO_STANDINGS[groupLetter]){
    return DEMO_STANDINGS[groupLetter];
  }
  if(cachedStandings[groupLetter]) return cachedStandings[groupLetter];
  // Fallback: zeroed-out table from our schedule
  const teams = GROUP_TEAMS[groupLetter] || [];
  return teams.map((t, i) => ({
    pos: i+1, name: t.name, code: t.code,
    p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0
  }));
}

// ─── Render ────────────────────────────────────────────────────
function render(){
  const now   = getNow();
  const in24h = new Date(now.getTime() + 24*60*60*1000);

  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dayDisplay').textContent  = days[now.getDay()];
  document.getElementById('dateDisplay').textContent = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  // Use API fixtures if we have them, otherwise fall back to our schedule
  const todayFixtures = cachedFixtures.length > 0
    ? cachedFixtures
    : getTodayFromSchedule().map(f => ({
        home: f.home, away: f.away,
        homeCode: FLAG_CODES[f.home] || 'un',
        awayCode: FLAG_CODES[f.away] || 'un',
        group: f.group, venue: f.venue,
        kickoff: getKickoffUTC(f),
        homeFT: null, awayFT: null,
      }));

  const involvedGroups = [...new Set(todayFixtures.map(f => f.group).filter(g => g !== '?'))].sort();
  const mainEl = document.getElementById('mainContent');

  if(todayFixtures.length === 0){
    const wcStart = new Date('2026-06-11T19:00:00Z');
    if(now < wcStart){
      const daysLeft = getDaysUntilWorldCup();
      mainEl.innerHTML = `
        <div class="no-games">
          <div class="no-games-title">The World Cup hasn't started yet!</div>
          <div class="no-games-sub">The tournament kicks off on 11 June 2026<br>with Mexico vs South Africa at the Estadio Azteca.</div>
          <div class="countdown-box">
            <div class="countdown-label">Days until kick-off</div>
            <div class="countdown-value">${daysLeft}</div>
          </div>
        </div>`;
    } else {
      mainEl.innerHTML = `
        <div class="no-games">
          <div class="no-games-title">No matches in the next 24 hours</div>
          <div class="no-games-sub">Check back later — more group stage action is on the way.</div>
        </div>`;
    }
    buildTicker([]);
    return;
  }

  let html = `<div class="games-count"><span>${todayFixtures.length}</span> match${todayFixtures.length!==1?'es':''} today</div>`;
  html += `<div class="games-grid">`;

  todayFixtures.forEach(f => {
    const localStr = f.kickoff.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZoneName:'short'});
    const score    = getApiScore({home:f.home, away:f.away, date: f.kickoff.toISOString().slice(0,10)});
    const hasScore = score && score.home !== null && score.away !== null;

    const scoreHtml = hasScore
      ? `<div class="final-score"><span class="score-num">${score.home}</span><span class="score-sep">–</span><span class="score-num">${score.away}</span><span class="score-ft">FT</span></div>`
      : '';

    html += `
      <div class="match-card">
        <div class="card-top">
          <span class="group-badge">Group ${f.group}</span>
          <span class="kickoff-time">🕐 ${localStr}</span>
        </div>
        <div class="teams-row">
          <div class="team">
            <div class="flag">${flagImg(f.homeCode, 'lg')}</div>
            <div class="team-name">${f.home}</div>
          </div>
          <div class="vs-divider">
            ${hasScore ? scoreHtml : '<span class="vs-text">VS</span>'}
          </div>
          <div class="team">
            <div class="flag">${flagImg(f.awayCode, 'lg')}</div>
            <div class="team-name">${f.away}</div>
          </div>
        </div>
        <div class="venue-row">
          <svg class="venue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span class="venue-text">${f.venue}</span>
        </div>
      </div>`;
  });
  html += `</div>`;

  if(involvedGroups.length > 0){
    html += `<div class="section-header">Group Standings</div>`;
    html += `<div class="groups-grid">`;
    involvedGroups.forEach(g => {
      const standings  = getStandings(g);
      const playingNow = new Set(todayFixtures.filter(f=>f.group===g).flatMap(f=>[f.home,f.away]));
      let tableHtml = `
        <div class="group-card">
          <div class="group-card-title">Group ${g}</div>
          <table class="standings-table">
            <thead><tr>
              <th class="col-team" colspan="2"></th>
              <th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th>
            </tr></thead><tbody>`;
      standings.forEach((t, i) => {
        const isPlaying = playingNow.has(t.name);
        tableHtml += `
          <tr class="${isPlaying ? 'playing-row' : ''}">
            <td class="col-team" style="display:table-cell;padding-right:6px;width:18px;"><span class="pos-num">${i+1}</span></td>
            <td class="col-team">
              <span class="team-flag-sm">${flagImg(t.code || FLAG_CODES[t.name] || 'un', 'sm')}</span>
              <span>${t.name}</span>
              ${isPlaying ? '<span class="playing-indicator"></span>' : ''}
            </td>
            <td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td>
            <td class="pts-col">${t.pts}</td>
          </tr>`;
      });
      tableHtml += `</tbody></table></div>`;
      html += tableHtml;
    });
    html += `</div>`;
  }

  mainEl.innerHTML = html;
  buildTicker(todayFixtures);
}

function buildTicker(fixtures){
  const items = fixtures.length > 0
    ? fixtures.map(f => {
        const score    = getApiScore({home:f.home, away:f.away, date:f.kickoff.toISOString().slice(0,10)});
        const hasScore = score && score.home !== null && score.away !== null;
        const t        = f.kickoff.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
        const scoreStr = hasScore ? ` · <strong>${score.home}–${score.away} FT</strong>` : ` · ${t}`;
        return `<span class="ticker-item"><strong>Group ${f.group}:</strong> ${f.home} vs ${f.away}${scoreStr} · ${f.venue}</span>`;
      })
    : [`<span class="ticker-item">World Cup 2026 · USA · Canada · Mexico · June 11 – July 19, 2026 · 48 Teams · 104 Matches</span>`];
  document.getElementById('tickerContent').innerHTML = [...items, ...items].join('');
}

// ─── Boot ──────────────────────────────────────────────────────
let clockInterval;

async function boot(){
  const now = getNow();

  // Before tournament, no API calls needed
  if(now < new Date('2026-06-11T00:00:00Z')){
    setStatus('idle');
    render();
    // Still tick the clock every minute
    clockInterval = setInterval(() => render(), 60*1000);
    return;
  }

  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE'){
    setStatus('no_key');
    render();
    return;
  }

  // Check if we should fetch now (it's past 7am and we haven't fetched today)
  const today = now.toISOString().slice(0,10);
  const h     = now.getHours();

  if(h >= FETCH_HOUR && lastFetchDate !== today && getReqCount() < FREE_TIER_LIMIT){
    await doFetch();
  } else if(lastFetchDate !== today){
    setStatus('idle'); // waiting for 7am
  }

  render();

  // Check once a minute if it's time to fetch (e.g. page was open before 7am)
  clockInterval = setInterval(async () => {
    const now   = getNow();
    const today = now.toISOString().slice(0,10);
    const h     = now.getHours();
    if(h >= FETCH_HOUR && lastFetchDate !== today && getReqCount() < FREE_TIER_LIMIT){
      await doFetch();
    }
    render();
  }, 60*1000);
}

boot();
</script>

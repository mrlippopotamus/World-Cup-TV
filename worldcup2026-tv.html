<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --green-dark: #0F3D25;
    --green-mid: #155230;
    --green-pitch: #1E7A44;
    --green-light: #33AA5E;
    --white: #F5F0E8;
    --offwhite: #E8DFC8;
    --text-muted: #9A9080;
    --card-bg: rgba(20, 70, 42, 0.85);
    --card-border: rgba(201, 168, 76, 0.4);
    --group-tag: rgba(201, 168, 76, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--green-dark);
    font-family: 'Barlow', sans-serif;
    color: var(--white);
    overflow-x: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(44,150,82,0.25) 0%, transparent 70%),
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.02) 60px,
        rgba(255,255,255,0.02) 61px
      ),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 60px,
        rgba(255,255,255,0.02) 60px,
        rgba(255,255,255,0.02) 61px
      ),
      var(--green-dark);
    min-height: 100vh;
    padding: 40px 60px 100px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--card-border);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .trophy-icon {
    width: 56px;
    height: 56px;
  }

  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 3px;
    line-height: 1;
    color: var(--gold);
    text-shadow: 0 0 40px rgba(201,168,76,0.4);
  }

  .header-sub {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .header-date {
    text-align: right;
  }

  .date-day {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .date-full {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ── NO GAMES ── */
  .no-games {
    text-align: center;
    padding: 100px 40px;
  }

  .no-games-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-bottom: 16px;
  }

  .no-games-sub {
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.7;
  }

  .countdown-box {
    display: inline-block;
    margin-top: 32px;
    padding: 20px 40px;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    background: var(--card-bg);
  }

  .countdown-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .countdown-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    letter-spacing: 4px;
  }

  /* ── GAMES GRID ── */
  .games-count {
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .games-count span {
    color: var(--gold);
    font-weight: 600;
  }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 20px;
  }

  /* ── MATCH CARD ── */
  .match-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(4px);
    transition: border-color 0.2s;
  }

  .match-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .match-card.live {
    border-color: rgba(44,150,82,0.7);
    box-shadow: 0 0 24px rgba(44,150,82,0.25);
  }

  .match-card.live::before {
    background: linear-gradient(90deg, transparent, #2C9652, transparent);
    opacity: 1;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .group-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: var(--group-tag);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
  }

  .live-badge {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: rgba(44,150,82,0.7);
    border: 1px solid rgba(44,150,82,0.9);
    border-radius: 6px;
    padding: 4px 10px;
    font-weight: 600;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .kickoff-time {
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  /* ── TEAMS ── */
  .teams-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
  }

  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .flag {
    width: 64px;
    height: 46px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
    background: rgba(0,0,0,0.2);
  }
  .flag img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 4px;
  }

  .team-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--white);
    text-align: center;
  }

  .vs-divider {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .vs-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 2px;
  }

  /* ── VENUE ── */
  .venue-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }

  .venue-icon {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .venue-text {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  /* ── GROUP BREAKDOWN SECTION ── */

  .team-flag-sm {
    width: 22px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 2px;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
  }
  .team-flag-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .playing-indicator {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
    display: inline-block;
    margin-left: 2px;
  }

  .pos-num {
    font-size: 11px;
    color: var(--text-muted);
    width: 14px;
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 60px;
    margin-bottom: 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── TICKER ── */
  .live-score, .final-score {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .live-score {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--white);
    line-height: 1;
    letter-spacing: 1px;
  }

  .score-sep {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: rgba(255,255,255,0.3);
  }

  .score-min {
    font-size: 11px;
    color: var(--green-light);
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .final-score {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .score-ft {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-left: 2px;
  }

  .proxy-status {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .ticker-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    background: rgba(15, 58, 35, 0.97);
    border-top: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  .ticker-label {
    padding: 0 20px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    white-space: nowrap;
    border-right: 1px solid var(--card-border);
    height: 100%;
    display: flex;
    align-items: center;
    background: rgba(15, 50, 30, 1);
    flex-shrink: 0;
    z-index: 9;
  }

  .ticker-scroll {
    display: flex;
    gap: 0;
    animation: ticker 60s linear infinite;
    white-space: nowrap;
    font-size: 13px;
    color: var(--offwhite);
    letter-spacing: 0.5px;
  }

  .ticker-item {
    padding: 0 48px 0 0;
  }

  .ticker-item strong {
    color: var(--gold);
  }

  @keyframes ticker {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>

function getKickoffUTC(fixture){
  const [y,mo,d] = fixture.date.split('-').map(Number);
  let date = new Date(Date.UTC(y, mo-1, d, fixture.utcH, fixture.utcM));
  return date;
}

function getDaysUntilWorldCup(){
  const now = new Date();
  const wc = new Date('2026-06-11T00:00:00Z');
  const diff = wc - now;
  if(diff <= 0) return 0;
  return Math.ceil(diff / (1000*60*60*24));
}

// ─── API fetch ────────────────────────────────────────────────
async function apiFetch(path){
  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE') throw new Error('NO_KEY');
  if(getReqCount() >= FREE_TIER_LIMIT) throw new Error('RATE_LIMIT');
  const res = await fetch(API_BASE + path, {
    headers: {
      'x-rapidapi-key':  RAPIDAPI_KEY,

  });
  if(res.status === 429) throw new Error('RATE_LIMIT');
  if(!res.ok) throw new Error(`HTTP ${res.status}`);

  return res.json();

// ─── Resolve World Cup tournament IDs ─────────────────────────
async function resolveWCIds(){
  if(WC_STAGE_ID) return true;
  try {
    const data = await apiFetch(`/v1/tournaments/list?locale=${LOCALE}&sport_id=${SPORT_ID}`);
    for(const t of (data?.DATA || [])){
      const name    = (t.LEAGUE_NAME || '').toLowerCase();
      const country = (t.COUNTRY_NAME || '').toLowerCase();
      // FlashLive files the World Cup under "World Championship" with country "World"
      const isWorldCupTournament = country === 'world' && (
        name.includes('world cup') || name.includes('fifa world cup') ||
        name.includes('world championship')
      );
      if(isWorldCupTournament){
        WC_STAGE_ID  = t.STAGES?.[0]?.STAGE_ID || null;
        WC_SEASON_ID = t.ACTUAL_TOURNAMENT_SEASON_ID || null;
        return true;
      }
    }
    return false;
  } catch(e){ console.warn('resolveWCIds:', e.message); return false; }
}

// ─── Fetch today's fixtures from FlashLive ────────────────────
// Knockout round names FlashLive may use in the ROUND field, mapped to a
// short display label since these matches have no "Group" letter.
function knockoutRoundLabel(roundStr) {
    const r = (roundStr || '').toLowerCase().trim();

    // Round of 32
    if (r.includes('1/16') || r.includes('round of 32') || r.includes('last 32'))
        return 'Round of 32';

    // Round of 16
    if (r.includes('1/8') || r.includes('round of 16') || r.includes('last 16'))
        return 'Round of 16';

    // Quarter-finals
    if (r.includes('quarter'))
        return 'Quarter-Final';

    // Semi-finals
    if (r.includes('semi'))
        return 'Semi-Final';

    // Third place
    if (r.includes('3rd') || r.includes('third'))
        return '3rd Place';

    // Final (must be LAST)
    if (r === 'final' || r === 'finals')
        return 'Final';

    return roundStr;
}

async function fetchTodayFixtures(){
  try {
    const data = await apiFetch(`/v1/events/list?locale=${LOCALE}&sport_id=${SPORT_ID}&timezone=0&indent_days=0`);
    const result = [];
    (data?.DATA || []).forEach(group => {
      const name    = (group.NAME || group.LEAGUE_NAME || '').toLowerCase();
      const country = (group.COUNTRY_NAME || '').toLowerCase();
      // FlashLive files the 2026 World Cup under "World: World Championship"
      const isWC = country === 'world' && (
        name.includes('world cup') || name.includes('world championship')
      );
      if(!isWC) return;

      (group.EVENTS || []).forEach(ev => {
        const home = normName(ev.HOME_NAME || '');
        const away = normName(ev.AWAY_NAME || '');
        // Find matching fixture in our group-stage schedule for venue/group info
        const match = ALL_FIXTURES.find(f => f.home === home || f.away === away || f.home === away || f.away === home);

        // Group stage match → use known group letter.
        // Knockout match (no match found, or round indicates knockout) → label by round instead.
        const roundLabel = knockoutRoundLabel(ev.ROUND || '');
        const isKnockout  = !match || /round of|quarter|semi|final|3rd|knockout/i.test(ev.ROUND || '');

        result.push({
          home, away,
          homeCode: FLAG_CODES[home] || 'un',
          awayCode: FLAG_CODES[away] || 'un',
          group:    isKnockout ? roundLabel : match.group,
          isKnockout,
          venue:    match?.venue || ev.VENUE_NAME || '',
          kickoff:  new Date(ev.START_TIME * 1000),
          homeFT:   ev.STAGE_TYPE === 'FINISHED' ? parseInt(ev.HOME_SCORE_CURRENT) : null,
          awayFT:   ev.STAGE_TYPE === 'FINISHED' ? parseInt(ev.AWAY_SCORE_CURRENT) : null,
        });
      });
    });
    return result;
  } catch(e){ console.warn('fetchTodayFixtures:', e.message); return []; }
}

// ─── Main daily fetch ─────────────────────────────────────────
async function doFetch(){
  const today = getNow().toISOString().slice(0,10);
  setStatus('fetching');

  const wcOk = await resolveWCIds();
  if(!wcOk){
    // Tournament not listed yet — fall back to our hardcoded fixture schedule
    cachedFixtures  = [];
    lastFetchDate   = today;
    setStatus('no_tournament');
    return;
  }

  const fixtures = await fetchTodayFixtures();
  cachedFixtures = fixtures;

  lastFetchDate = today;
  setStatus('ok');

}

// ─── Status display ───────────────────────────────────────────
let currentStatus = 'idle';
function setStatus(s){ currentStatus = s; updateStatusBar(); }

function updateStatusBar(){
  const el = document.getElementById('proxyStatus');
  if(!el) return;
  const count = getReqCount();
  const pct   = Math.min(Math.round((count / FREE_TIER_LIMIT) * 100), 100);
  const barCol = pct >= 100 ? '#8B3030' : pct >= 80 ? '#C9A84C' : '#2C9652';
  const bar    = `<span style="display:inline-block;width:80px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin-left:10px;vertical-align:middle;overflow:hidden;"><span style="display:block;width:${pct}%;height:100%;background:${barCol};border-radius:2px;"></span></span>`;

  const nextFetch = getNextFetchTime();
  const nextStr   = nextFetch ? ' · Next fetch ' + nextFetch : '';

  const msgs = {
    ok:            dot('#2C9652') + `Data fetched at ${FETCH_HOUR}:00 · ${count}/${FREE_TIER_LIMIT} requests used today` + nextStr + bar,
    fetching:      dot('#C9A84C') + 'Fetching data…',
    no_tournament: dot('#C9A84C') + 'World Cup not listed yet — using schedule data' + nextStr,
    limit:         dot('#8B3030') + `Daily limit reached (${count}/${FREE_TIER_LIMIT}) — resets at midnight`,
    no_key:        dot('#8B3030') + 'API key needed — see README',
    idle:          dot('#6A6050') + 'Waiting for ' + FETCH_HOUR + ':00 fetch…',
    error:         dot('#8B3030') + 'Fetch failed — using schedule data' + nextStr,
  };
  el.innerHTML = msgs[currentStatus] || msgs.idle;
}
function dot(col){
  return `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:6px;vertical-align:middle;"></span>`;
}
function updateReqDisplay(){ updateStatusBar(); }

function getNextFetchTime(){
  const now  = getNow();
  const next = new Date(now);
  next.setHours(FETCH_HOUR, 0, 0, 0);
  if(next <= now) next.setDate(next.getDate() + 1);
  const diff = next - now;
  const h    = Math.floor(diff / 3600000);
  const m    = Math.floor((diff % 3600000) / 60000);
  if(h > 0) return `in ${h}h ${m}m`;
  return `in ${m}m`;
}

// ─── Score lookup ──────────────────────────────────────────────
function getApiScore(fixture){
  const match = cachedFixtures.find(f => f.home === fixture.home && f.away === fixture.away);
  if(!match) return null;
  if(match.homeFT !== null && match.awayFT !== null){
    return { home: match.homeFT, away: match.awayFT, minute: null, status: 'ft' };
  }
  return null;
}

// ─── Get today's fixtures from hardcoded schedule (fallback) ──
function localDateStr(date){
  // Returns 'YYYY-MM-DD' in the browser's local timezone
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function getTodayFromSchedule(){
  const now   = getNow();
  const in24h = new Date(now.getTime() + 24*60*60*1000);

  // Local midnight = start of today in the browser's timezone
  // new Date(y, m, d) uses LOCAL time, so this is correct in BST
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);

  return ALL_FIXTURES.filter(f => {
    const ko = getKickoffUTC(f);
    // Must kick off after local midnight today (not a previous day's game)
    if(ko < todayMidnight) return false;
    // Must kick off within the next 24 hours
    if(ko > in24h) return false;
    return true;
  });
}


// ─── Render ────────────────────────────────────────────────────
function render(){
  const now   = getNow();
  const in24h = new Date(now.getTime() + 24*60*60*1000);

  const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dayDisplay').textContent  = days[now.getDay()];
  document.getElementById('dateDisplay').textContent = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  // Use API fixtures if we have them, otherwise fall back to our schedule
  const todayFixtures = cachedFixtures.length > 0
    ? cachedFixtures
    : getTodayFromSchedule().map(f => ({
        home: f.home, away: f.away,
        homeCode: FLAG_CODES[f.home] || 'un',
        awayCode: FLAG_CODES[f.away] || 'un',
        group: f.group, venue: f.venue,
        kickoff: getKickoffUTC(f),
        homeFT: null, awayFT: null,
      }));

  const mainEl = document.getElementById('mainContent');

  if(todayFixtures.length === 0){
    const wcStart = new Date('2026-06-11T19:00:00Z');
    if(now < wcStart){
      const daysLeft = getDaysUntilWorldCup();
      mainEl.innerHTML = `
        <div class="no-games">
          <div class="no-games-title">The World Cup hasn't started yet!</div>
          <div class="no-games-sub">The tournament kicks off on 11 June 2026<br>with Mexico vs South Africa at the Estadio Azteca.</div>
          <div class="countdown-box">
            <div class="countdown-label">Days until kick-off</div>
            <div class="countdown-value">${daysLeft}</div>
          </div>
        </div>`;
    } else {
      mainEl.innerHTML = `
        <div class="no-games">
          <div class="no-games-title">No matches in the next 24 hours</div>
          <div class="no-games-sub">Check back later — more group stage action is on the way.</div>
        </div>`;
    }
    buildTicker([]);
    return;
  }

  let html = `<div class="games-count"><span>${todayFixtures.length}</span> match${todayFixtures.length!==1?'es':''} today</div>`;
  html += `<div class="games-grid">`;

  todayFixtures.forEach(f => {
    const localStr = f.kickoff.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', timeZoneName:'short'});
    const score    = getApiScore({home:f.home, away:f.away, date: f.kickoff.toISOString().slice(0,10)});
    const hasScore = score && score.home !== null && score.away !== null;

    const scoreHtml = hasScore
      ? `<div class="final-score"><span class="score-num">${score.home}</span><span class="score-sep">–</span><span class="score-num">${score.away}</span><span class="score-ft">FT</span></div>`
      : '';

    html += `
      <div class="match-card">
        <div class="card-top">
          <span class="group-badge">${f.isKnockout ? f.group : "Group " + f.group}</span>
          <span class="kickoff-time">🕐 ${localStr}</span>
        </div>
        <div class="teams-row">
          <div class="team">
            <div class="flag">${flagImg(f.homeCode, 'lg')}</div>
            <div class="team-name">${f.home}</div>
          </div>
          <div class="vs-divider">
            ${hasScore ? scoreHtml : '<span class="vs-text">VS</span>'}
          </div>
          <div class="team">
            <div class="flag">${flagImg(f.awayCode, 'lg')}</div>
            <div class="team-name">${f.away}</div>
          </div>
        </div>
        <div class="venue-row">
          <svg class="venue-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          <span class="venue-text">${f.venue}</span>
        </div>
      </div>`;
  });
  html += `</div>`;

  mainEl.innerHTML = html;
  buildTicker(todayFixtures);
}

function buildTicker(fixtures){
  const items = fixtures.length > 0
    ? fixtures.map(f => {
        const score    = getApiScore({home:f.home, away:f.away, date:f.kickoff.toISOString().slice(0,10)});
        const hasScore = score && score.home !== null && score.away !== null;
        const t        = f.kickoff.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
        const scoreStr = hasScore ? ` · <strong>${score.home}–${score.away} FT</strong>` : ` · ${t}`;
        return `<span class="ticker-item"><strong>${f.isKnockout ? f.group : "Group " + f.group}:</strong> ${f.home} vs ${f.away}${scoreStr} · ${f.venue}</span>`;
      })
    : [`<span class="ticker-item">World Cup 2026 · USA · Canada · Mexico · June 11 – July 19, 2026 · 48 Teams · 104 Matches</span>`];
  document.getElementById('tickerContent').innerHTML = [...items, ...items].join('');
}

// ─── Boot ──────────────────────────────────────────────────────
let clockInterval;

async function boot(){
  const now = getNow();

  // Before tournament, no API calls needed
  if(now < new Date('2026-06-11T00:00:00Z')){
    setStatus('idle');
    render();
    // Still tick the clock every minute
    clockInterval = setInterval(() => render(), 60*1000);
    return;
  }

  if(RAPIDAPI_KEY === 'PASTE_YOUR_RAPIDAPI_KEY_HERE'){
    setStatus('no_key');
    render();
    return;
  }

  // Check if we should fetch now (it's past 7am and we haven't fetched today)
  const today = now.toISOString().slice(0,10);
  const h     = now.getHours();

  if(h >= FETCH_HOUR && lastFetchDate !== today && getReqCount() < FREE_TIER_LIMIT){
    await doFetch();
  } else if(lastFetchDate !== today){
    setStatus('idle'); // waiting for 7am
  }

  render();

  // Check once a minute if it's time to fetch (e.g. page was open before 7am)
  clockInterval = setInterval(async () => {
    const now   = getNow();
    const today = now.toISOString().slice(0,10);
    const h     = now.getHours();
    if(h >= FETCH_HOUR && lastFetchDate !== today && getReqCount() < FREE_TIER_LIMIT){
      await doFetch();
    }
    render();
  }, 60*1000);
}

boot();
